<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aile Ağacı</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="card login-card">
      <h1>🌳 Aile Ağacı</h1>
      <p class="muted">Devam etmek için giriş yapın</p>
      <label>E-posta<input type="email" id="login-email" required autocomplete="username" /></label>
      <label>Parola<input type="password" id="login-password" required autocomplete="current-password" /></label>
      <button type="submit">Giriş Yap</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand">🌳 Aile Ağacı</div>
      <nav class="tabs">
        <button class="tab active" data-tab="people">Kişiler</button>
        <button class="tab" data-tab="tree">Ağaç</button>
        <button class="tab" data-tab="import">İçe Aktar</button>
        <button class="tab admin-only hidden" data-tab="users">Kullanıcılar</button>
      </nav>
      <div class="user-box">
        <span id="user-label" class="muted"></span>
        <button id="export-btn" class="ghost" title="GEDCOM olarak indir">⬇ GEDCOM</button>
        <button id="logout-btn" class="ghost">Çıkış</button>
      </div>
    </header>

    <!-- People tab -->
    <section id="tab-people" class="tab-panel">
      <div class="people-layout">
        <aside class="sidebar">
          <div class="sidebar-head">
            <input type="search" id="people-search" placeholder="Ara (isim)..." />
            <button id="add-person-btn" class="editor-only">+ Yeni</button>
          </div>
          <ul id="people-list" class="people-list"></ul>
        </aside>
        <main id="person-detail" class="detail">
          <p class="muted center">Soldan bir kişi seçin.</p>
        </main>
      </div>
    </section>

    <!-- Tree tab -->
    <section id="tab-tree" class="tab-panel hidden">
      <div class="tree-controls">
        <label>Kök kişi:
          <div class="combo" id="tree-root-combo">
            <input type="text" id="tree-root-input" placeholder="Kişi ara…" autocomplete="off" />
            <div class="combo-list hidden" id="tree-root-list"></div>
          </div>
        </label>
        <label>Yön:
          <select id="tree-direction">
            <option value="down" selected>Alt soy (çocuklara doğru)</option>
            <option value="up">Atalar (ebeveynlere doğru)</option>
            <option value="focus">Odaklı (tüm alt soy + üst soy)</option>
          </select>
        </label>
        <label>Nesil derinliği:
          <input type="number" id="tree-depth" min="1" max="30" value="8" />
        </label>
        <button id="tree-render">Göster</button>
        <div class="zoom-controls">
          <button id="zoom-in" class="ghost" title="Yaklaştır">＋</button>
          <button id="zoom-out" class="ghost" title="Uzaklaştır">－</button>
          <button id="zoom-fit" class="ghost" title="Ekrana sığdır">⛶</button>
        </div>
      </div>
      <div id="tree-canvas" class="tree-canvas"></div>
    </section>

    <!-- Import tab -->
    <section id="tab-import" class="tab-panel hidden">
      <div class="card import-card editor-only">
        <h2>GEDCOM İçe Aktar</h2>
        <p class="muted">MyHeritage / diğer araçlardan aldığınız <code>.ged</code> dosyasını yükleyin.
          Kayıtlar mevcut ağaca <strong>eklenir</strong>.</p>
        <input type="file" id="gedcom-file" accept=".ged,.gedcom,text/plain" />
        <button id="import-btn">Yükle ve İçe Aktar</button>
        <div id="import-result"></div>
      </div>
      <p class="viewer-note muted hidden">İçe aktarma için düzenleyici yetkisi gerekir.</p>
    </section>

    <!-- Users tab (admin) -->
    <section id="tab-users" class="tab-panel hidden">
      <div class="card">
        <h2>Kullanıcılar</h2>
        <form id="user-form" class="user-form">
          <input type="text" id="nu-name" placeholder="Ad Soyad" />
          <input type="email" id="nu-email" placeholder="E-posta" required />
          <input type="password" id="nu-password" placeholder="Parola" required />
          <select id="nu-role">
            <option value="viewer">Görüntüleyici</option>
            <option value="editor">Düzenleyici</option>
            <option value="admin">Yönetici</option>
          </select>
          <button type="submit">Ekle</button>
        </form>
        <table id="users-table" class="users-table"></table>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
