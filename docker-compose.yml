services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aile}
      POSTGRES_DB: ${POSTGRES_DB:-aile_agaci}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aile} -d ${POSTGRES_DB:-aile_agaci}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aile}:${POSTGRES_PASSWORD:-aile}@db:5432/${POSTGRES_DB:-aile_agaci}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_NAME: ${ADMIN_NAME:-Yönetici}
      UPLOAD_DIR: /data/uploads
    ports:
      - "${WEB_PORT:-8080}:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  db_data:
  uploads:
